[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-knowledge-assistant"
version = "0.1.0"
description = "Production-ready RAG knowledge assistant: grounded, cited, permission-aware answers over your documents."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy[asyncio]>=2.1.6,<2.2",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "celery[redis]>=5.6,<6",
    "pymupdf>=2.0,<3",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.32",
    "structlog>=26.1",
    "langdetect==1.0.9",
    "pgvector>=0.5,<0.6",
    "numpy>=2.2,<3",
    "httpx>=0.28,<1",
    "anthropic>=2.3,<3",
    "sse-starlette>=3.6,<4",
]

[project.optional-dependencies]
# Local embeddings (EMBEDDING_PROVIDER=local, BAAI/bge-m3). Pulls in PyTorch (~2 GB).
local = ["sentence-transformers>=4,<6"]  # 4.0 added CrossEncoder activation_fn
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    "aiosqlite>=0.22",
    "ruff>=0.17",
    "mypy>=2.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "S311", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docx.*", "langdetect.*", "celery.*", "pymupdf.*", "pgvector.*", "sentence_transformers.*", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.workers.*"]
disallow_untyped_decorators = false  # Celery's decorators are untyped

[[tool.mypy.overrides]]
module = ["app.ingestion.parsers.pdf"]
disallow_untyped_calls = false  # PyMuPDF ships partial type hints
